name: collect
on:
  workflow_dispatch:
  schedule:
    - cron: "11 3,4,5 * * 1-5"
    - cron: "41 12 * * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - name: loop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          END=$(( $(date +%s) + 5*3600 + 1200 ))
          while [ $(date +%s) -lt $END ]; do
            DOW=$(date -u +%u); HM=$((10#$(date -u +%H%M)))
            if [ $DOW -le 5 ] && [ $HM -ge 605 ] && [ $HM -le 1055 ]; then
              python collect.py || echo "collect failed"
              python forward.py . || echo "forward failed"
              git add data forward
              git commit -m snapshot || echo "nothing to commit"
              git pull --rebase || true
              git push || true
              sleep 720
            else
              sleep 240
            fi
          done
          gh workflow run collect.yml --ref main
