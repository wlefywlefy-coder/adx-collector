name: history
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python history.py
      - run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add data/history
          git commit -m "history" || echo "nothing to commit"
          git pull --rebase
          git push
